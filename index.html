<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SM AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 40px 18px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 18px;
      color: #cbd5e1;
    }

    .chat {
      background: #1e293b;
      padding: 20px;
      border-radius: 15px;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      padding: 15px;
      border-radius: 10px;
      border: none;
      font-size: 18px;
      resize: vertical;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #answer {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #334155;
      border-radius: 10px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>SM AI</h1>
      <div class="subtitle">ستاسې هوښیار AI مرستیال</div>
    </header>

    <div class="chat">

      <textarea
        id="question"
        placeholder="خپله پوښتنه دلته ولیکئ..."
      ></textarea>

      <button onclick="askAI()">
        پوښتنه واستوئ
      </button>

      <div id="answer"></div>

    </div>

    <footer>
      2026 SM AI - ټول حقوق خوندي دي
    </footer>

  </div>

  <script>
    async function askAI() {
      const question = document.getElementById("question").value.trim();
      const answer = document.getElementById("answer");

      if (!question) {
        answer.style.display = "block";
        answer.innerHTML = "مهرباني وکړئ خپله پوښتنه ولیکئ.";
        return;
      }

      answer.style.display = "block";
      answer.innerHTML = "⏳ لږ انتظار وکړئ...";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            question: question
          })
        });

        const data = await response.json();

        answer.innerHTML =
          data.answer || "ځواب ترلاسه نه شو.";

      } catch (error) {
        answer.innerHTML =
          "د سرور سره د اړیکې ستونزه رامنځته شوه.";
      }
    }
  </script>

</body>
</html>
