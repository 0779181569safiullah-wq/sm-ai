<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SM AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 40px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header h1 {
      font-size: 52px;
      margin: 0 0 10px;
      direction: ltr;
    }

    .header p {
      font-size: 22px;
      color: #cbd5e1;
      margin: 0;
    }

    .chat-box {
      background: #1e293b;
      padding: 25px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    textarea {
      width: 100%;
      height: 180px;
      border: none;
      outline: none;
      resize: vertical;
      border-radius: 18px;
      padding: 20px;
      font-size: 20px;
      font-family: Arial, sans-serif;
      direction: rtl;
      background: white;
      color: #111827;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 18px;
      border: none;
      border-radius: 16px;
      background: #2563eb;
      color: white;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: #64748b;
      cursor: not-allowed;
    }

    .answer {
      margin-top: 25px;
      background: #334155;
      padding: 22px;
      border-radius: 18px;
      min-height: 100px;
      font-size: 19px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .answer-title {
      font-weight: bold;
      margin-bottom: 10px;
      color: #e2e8f0;
    }

    .footer {
      text-align: center;
      margin-top: 35px;
      color: #94a3b8;
      font-size: 16px;
    }

    @media (max-width: 500px) {
      .container {
        padding: 30px 15px;
      }

      .header h1 {
        font-size: 44px;
      }

      .header p {
        font-size: 19px;
      }

      textarea {
        height: 170px;
        font-size: 18px;
      }

      button {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>SM AI</h1>
      <p>ستاسې هوښیار AI مرستیال</p>
    </div>

    <div class="chat-box">

      <textarea
        id="question"
        placeholder="خپله پوښتنه دلته ولیکئ..."
      ></textarea>

      <button id="sendBtn" onclick="sendQuestion()">
        پوښتنه واستوئ
      </button>

      <div class="answer" id="answer">
        <div class="answer-title">ستاسې پوښتنه:</div>
        <div id="answerText">دلته به ستاسې ځواب ښکاره شي.</div>
      </div>

    </div>

    <div class="footer">
      SM AI © 2026 - ټول حقوق خوندي دي
    </div>

  </div>


  <script>
    async function sendQuestion() {

      const question = document.getElementById("question").value.trim();
      const button = document.getElementById("sendBtn");
      const answerText = document.getElementById("answerText");

      if (!question) {
        answerText.textContent = "مهرباني وکړئ لومړی خپله پوښتنه ولیکئ.";
        return;
      }

      button.disabled = true;
      button.textContent = "ځواب چمتو کېږي...";
      answerText.textContent = "مهرباني وکړئ لږ انتظار وکړئ...";

      try {

        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            question: question
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "یوه ستونزه رامنځته شوه.");
        }

        answerText.textContent = data.answer || "ځواب ترلاسه نه شو.";

      } catch (error) {

        answerText.textContent =
          "بخښنه غواړم، د ځواب ترلاسه کولو پر مهال ستونزه رامنځته شوه.";

        console.error(error);

      } finally {

        button.disabled = false;
        button.textContent = "پوښتنه واستوئ";

      }
    }
  </script>

</body>
</html>
